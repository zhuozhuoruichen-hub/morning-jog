name: Build Windows portable release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64
      - name: Check source
        shell: pwsh
        run: |
          python -m compileall -q .
          python -c "import tkinter, android_location_test, morning_run; root=tkinter.Tk(); root.withdraw(); root.update(); root.destroy()"
      - name: Build portable archive
        run: python build_portable.py
      - name: Verify packaged runtime
        shell: pwsh
        run: |
          Push-Location dist/morning-jog-1.5.5-windows-x64
          & ./runtime/python.exe -c "import tkinter, android_location_test, morning_run; root=tkinter.Tk(); root.withdraw(); root.update(); root.destroy()"
          if ($LASTEXITCODE -ne 0) { throw 'Portable runtime check failed' }
          Pop-Location
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.5.5 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.5.5 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Windows portable 1.5.5" --notes-file README.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload v1.5.5 dist/morning-jog-1.5.5-windows-x64.zip dist/SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
